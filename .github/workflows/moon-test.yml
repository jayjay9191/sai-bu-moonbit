# 每次推送与 PR 自动跑 moon test。
# 安装方式按 MoonBit 官方文档（moonbitlang/x 等官方项目同款流程）：
# 官方安装脚本装 CLI，再 moon update 同步核心库，然后跑测试。
# 注意：不要改动同目录下的 copilot-setup-steps.yml（Copilot 专用）。
name: MoonBit test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Update MoonBit registry
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon update
      - name: Check generated data is in sync
        run: |
          python3 scripts/generate_data.py
          export PATH="$HOME/.moon/bin:$PATH"
          moon fmt
          git diff --exit-code -- competition_data.mbt ledger_history_data.mbt
      - name: Validate data
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon run cmd/main -- validate
      - name: Run tests
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test
      - name: Verify evidence audit and submission order CLI
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          python3 scripts/verify_review.py
